name: security-audit

# Blocking security gates that complement the zizmor static-analysis workflow
# (.github/workflows/zizmor.yml): zizmor reads the workflow graph for risky
# patterns, while this workflow answers the questions static analysis cannot —
# whether the committed dependency tree carries a known vulnerability, and
# whether the audit surface is enforced in CI rather than left to a contributor's
# machine.
#
# Runs on:
#   - pushes to main that touch the dependency manifests
#   - pull requests that touch the dependency manifests
#   - weekly cron (new advisories against an unchanged tree)
#   - manual dispatch
#
# The audit step is a hard gate: `pnpm audit` exits non-zero when the committed
# lockfile carries a vulnerability at or above the configured audit level, so a
# vulnerable tree fails the check instead of passing silently.

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 9 * * 1" # Mon 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Pinned Python build toolchain — see .github/python-toolchain.env, which is the
# single place these two values are recorded, along with the green run they came
# from. Change one, change them all: the python-toolchain-pins job in
# lint-release-workflows.yml fails if any workflow's literal disagrees with that file.
env:
  UV_VERSION: "0.12.1"
  PYTHON_VERSION: "3.12"

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact
