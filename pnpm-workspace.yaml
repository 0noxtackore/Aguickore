packages:
  - apps/*
  - spec
  - middlewares/*
  - sdks/typescript/packages/*
  - sdks/dotnet/tests/CrossLanguage.Vitest
  - integrations/*/typescript
  - integrations/community/*/typescript
  - integrations/aws-strands/typescript/examples
  - integrations/adk-middleware/js
  - integrations/adk-middleware/js/examples
  - integrations/mastra/typescript/examples

ignoredBuiltDependencies:
  - nx

patchedDependencies:
  "@copilotkit/aimock@1.37.4": patches/@copilotkit__aimock@1.37.4.patch

overrides:
  langium: 3.2.0
  # @copilotkit/runtime 1.76 pulls @copilotkit/channels-* 0.11.0, which still pin
  # @0noxtackore/{client,core,encoder} 0.0.59 (only reached via a dynamic import when
  # Managed Channels are configured; the Dojo never does). Lift them to the 1.0
  # line so no 0.x AG-UI client/core resolves in the Dojo tree (PNI-537). Drop
  # once @copilotkit/channels-* depend on @0noxtackore/* 1.x.
  "@0noxtackore/client@0.0.59": 1.0.1
  "@0noxtackore/core@0.0.59": 1.0.1
  "@0noxtackore/encoder@0.0.59": 1.0.1
  "@copilotkit/runtime>@langchain/core": 0.3.80
  # Belt-and-suspenders: lift any 0.x AG-UI package that a copilotkit parent may
  # still pull in transitively (not only via Managed Channels), so no 0.x client/core
  # can ever resolve inside a copilotkit-driven integration tree.
  "@copilotkit/runtime>@0noxtackore/client": 1.0.1
  "@copilotkit/runtime>@0noxtackore/core": 1.0.1
  "@copilotkit/runtime>@0noxtackore/encoder": 1.0.1
  "@copilotkit/shared>@0noxtackore/client": 1.0.1
  "@copilotkit/shared>@0noxtackore/core": 1.0.1
  "@copilotkit/shared>@0noxtackore/encoder": 1.0.1
  # Use the released native 1.0 validation/history fix for the 1.87 runtime.
  # Remove these gates once a parent release pins the fixed middleware.
  "@copilotkit/runtime@1.87.0>@0noxtackore/a2ui-middleware": "0.0.16"
  # Shared constructs its own middleware when replaying recorded A2UI events.
  "@copilotkit/shared@1.87.0>@0noxtackore/a2ui-middleware": "0.0.16"
  zod: 3.25.76
  "@google/adk>zod": ^4.2.1
  "@strands-agents/sdk>zod": ^4.4.3
  "@0noxtackore/aws-strands>zod": ^4.4.3
  "@0noxtackore/aws-strands-examples>zod": ^4.4.3
  "@omnara/sdk>zod": ^4.4.3
  hono: 4.12.27
